---
layout: default
---

<article class="page-shell">
  <header class="page-header">
    <p class="eyebrow">{{ page.kicker | default: "Personal archive" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="page-content">
    {{ content }}
  </div>
</article>
